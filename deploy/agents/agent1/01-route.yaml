apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agent1
  namespace: auth-platform
spec:
  parentRefs:
  - name: agents
    sectionName: https
  hostnames:
  - agent1.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: agent1
      port: 8080
