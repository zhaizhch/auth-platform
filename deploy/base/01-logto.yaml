# ===========================================================
# Logto — 自建 OIDC 认证中心（替代 sso.example.com）
#
# 端口规划（LoadBalancer 172.31.9.58，均启用 HTTPS）：
#   3001  ENDPOINT       用户端（登录/注册体验 + OIDC 端点）
#   3002  ADMIN_ENDPOINT 管理控制台（/console，SPA + Admin API）
#
# 注意：
#   - ENDPOINT 必须指向 3001、ADMIN_ENDPOINT 指向 3002，二者不能相同；
#     否则 core 会把 3002 上的请求当作用户端流量，/console 会被
#     fallback 到 experience SPA，浏览器前端路由渲染 404。
#   - 必须走 HTTPS：console 登录使用 PKCE，依赖浏览器 crypto.subtle，
#     而该 API 仅在安全上下文（HTTPS / localhost）下可用，
#     纯 HTTP 下登录会报 "Crypto.subtle is unavailable"。
#     证书由 logto-tls secret 提供（HTTPS_CERT_PATH / HTTPS_KEY_PATH）。
#     访问机器的浏览器需信任自签 CA（见 certs/ca.crt）。
#   - logto-db 数据落在 emptyDir，Pod 重建后数据丢失；
#     生产环境应改用 PVC。
# ===========================================================

# ---------- PostgreSQL（Logto 数据库） ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logto-db
  namespace: auth-platform
  labels:
    app: logto-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logto-db
  template:
    metadata:
      labels:
        app: logto-db
    spec:
      containers:
      - name: postgres
        image: yhg.hub.bjuci.io/library/postgres:16-alpine-amd64
        imagePullPolicy: IfNotPresent
        ports:
        - name: pg
          containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: logto
        - name: POSTGRES_PASSWORD
          value: logto
        - name: POSTGRES_DB
          value: logto
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: logto-db
  namespace: auth-platform
spec:
  selector:
    app: logto-db
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP

# ---------- Logto Core ----------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logto
  namespace: auth-platform
  labels:
    app: logto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logto
  template:
    metadata:
      labels:
        app: logto
    spec:
      initContainers:
      - name: logto-migrate
        image: yhg.hub.bjuci.io/library/logto:amd64
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
        - |
          npm run cli -- db seed --dapc --skip-when-exists &&
          npm run alteration -- deploy latest &&
          # 种子只创建了租户组织（t-default/t-admin）和默认管理员（admin），
          # 但没有建立成员关系，导致控制台刷新组织令牌时 403
          # （"user is not a member of the organization"）。
          # 这里把 admin 用户补进 t-default 组织并授予 admin 角色。
          node <<'NODE'
          const { Pool } = require('pg');
          const pool = new Pool({ connectionString: process.env.DB_URL });
          (async () => {
            await pool.query(
              "INSERT INTO organization_user_relations (tenant_id, organization_id, user_id) "
              + "SELECT 'admin', 't-default', id FROM users WHERE username = 'admin' "
              + "ON CONFLICT DO NOTHING"
            );
            await pool.query(
              "INSERT INTO organization_role_user_relations (tenant_id, organization_id, organization_role_id, user_id) "
              + "SELECT 'admin', 't-default', 'admin', id FROM users WHERE username = 'admin' "
              + "ON CONFLICT DO NOTHING"
            );
          })().finally(() => pool.end());
          NODE
        env:
        - name: DB_URL
          value: postgresql://logto:logto@logto-db:5432/logto
      containers:
      - name: logto
        image: yhg.hub.bjuci.io/library/logto:amd64
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3001
        - name: admin
          containerPort: 3002
        env:
        - name: DB_URL
          value: postgresql://logto:logto@logto-db:5432/logto
        # 用户端公开入口（登录/注册 + OIDC）
        - name: ENDPOINT
          value: https://172.31.9.58:3001
        # 管理控制台公开入口（/console）
        - name: ADMIN_ENDPOINT
          value: https://172.31.9.58:3002
        # HTTPS 证书（来自 logto-tls secret，两者同时设置时 core 启用 HTTPS）
        - name: HTTPS_CERT_PATH
          value: /etc/logto/certs/tls.crt
        - name: HTTPS_KEY_PATH
          value: /etc/logto/certs/tls.key
        - name: TRUST_PROXY_HEADERS
          value: "1"
        - name: PORT
          value: "3001"
        volumeMounts:
        - name: logto-tls
          mountPath: /etc/logto/certs
          readOnly: true
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1536Mi
      volumes:
      - name: logto-tls
        secret:
          secretName: logto-tls
---
apiVersion: v1
kind: Service
metadata:
  name: logto
  namespace: auth-platform
spec:
  selector:
    app: logto
  loadBalancerIP: 172.31.9.58
  ports:
  - name: core
    port: 3001
    targetPort: 3001
    nodePort: 30428
  - name: admin
    port: 3002
    targetPort: 3002
    nodePort: 32379
  type: LoadBalancer

